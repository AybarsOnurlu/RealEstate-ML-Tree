# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT (Windows/Linux x86-64)
#   docker compose up -d --build
#   curl http://localhost:8000/health
#
# PRODUCTION (Hetzner CAX ARM64):
#   Use docker-compose.prod.yml which adds:  platforms: [linux/arm64]
# ─────────────────────────────────────────────────────────────────────────────
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # No platform override → Docker uses host native arch (amd64 on Windows).
      # The Hetzner ARM64 server runs the same image built natively on arm64.
    image: realestate-api:latest
    container_name: realestate_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
