# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT (Windows/Linux x86-64)
#   docker compose up -d --build
#   curl http://localhost:8080/health
#
# PRODUCTION (AWS EC2 t3.large AMD64):
#   Ensures strict CPU/RAM limits to co-host with other applications.
# ─────────────────────────────────────────────────────────────────────────────
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # No platform override → Docker uses host native arch (amd64 on Windows).
      # The Hetzner ARM64 server runs the same image built natively on arm64.
    image: realestate-api:latest
    container_name: realestate_api
    platform: linux/amd64
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
